# WP6 extraction (spec §3, §4), mode(s) below. Since 2026-10-27 20:06 EDT, S in configs/models.yaml is
# Ministral 3 14B Instruct (SPEC_ISSUES); the Qwen3-14B runs made with this file are superseded. Prompts v1 (approved 2026-10-27, frozen).
# R = 23 prior reports (menuPass-P01 excluded), B = no-report per actor, oracle = OpTC red-team
# ground-truth PDF text (T9 upper bound only; never used for tuning).
experiment: extraction
actors: [APT29, menuPass, OilRig, Sandworm]
conditions: [R, B, oracle]
oracle_text: data/optc_check/groundtruth/OpTCRedTeamGroundTruth.txt
prompts: {report: extract_v1.txt, memory: memory_v1.txt}
chunk: {tokens: 6000, overlap: 300}
alpha: 0.5
modes: [S, S-sampled]
workers: {S: 1, S-sampled: 1}
