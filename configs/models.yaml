# Pinned extraction models (spec §3). Open-weight digests are the sha256 of the GGUF model
# layer in the Ollama manifest (~/.ollama/models/manifests/registry.ollama.ai/library/qwen3/<tag>);
# ollama_id is what `ollama list` shows. Pulled 2026-10-24 with Ollama 0.40.10.
# No extraction has been run with any of these yet.
# Sampling (spec §3, SPEC_ISSUES 2026-10-27): F accepts no temperature and its reasoning can't be
# turned off, so F = 5 samples per extraction (mean ± sd) at a pinned effort. S runs twice:
# temperature 0 (primary, `options`) and 5 samples at the model's default sampling (`sampled`,
# like-for-like with F), with thinking off in both.
ollama_version: "0.40.10"
frontier:
  F:
    model: claude-opus-5-5
    options: {effort: high, max_tokens: 16000}   # no sampling parameters: Opus 5.5 rejects them
    samples: 5
    usd_per_mtok: {input: 4.0, output: 20.0}
open_weight:
  S:  # primary
    tag: qwen3:14b
    ollama_id: bdbd181c33f2
    weights_sha256: a8cc1361f3145dc01f6d77c6c82c9116b9ffe3c97b34716fe20418455876c40e
    parameters: 14.8B
    quantization: Q4_K_M
    context_length: 40960
    options: {temperature: 0, num_ctx: 8192, think: false}
    # Default sampling = the Modelfile params of this digest (temperature 0.6, top_k 20,
    # top_p 0.95, repeat_penalty 1), so no temperature is sent; seed fixes each sample.
    sampled: {options: {num_ctx: 8192, think: false}, seeds: [0, 1, 2, 3, 4]}
  S_4B:  # size curve: Qwen3-4B-Instruct-2507, non-thinking
    tag: qwen3:4b-instruct
    ollama_id: 0edcdef34593
    weights_sha256: 85e4a5b7b8ef0e48af0e8658f5aaab9c2324c76c1641493f4d1e25fce54b18b9
    parameters: 4.0B
    quantization: Q4_K_M
    context_length: 262144
    options: {temperature: 0, num_ctx: 8192}
