experiment: redteam_scoring
version: collapsed
actors: [APT29, menuPass, OilRig, Sandworm]
alpha: 0.5
oracle_modes: [Q, Q5, M, M5]
bootstrap: {n: 1000, seed: 20261027}
workers: 6
runs:
  F: 20261027T223842Z-extraction-a686409
  Q: {run: 20261027T223928Z-extraction-a686409, mode: S}
  Q5: {run: 20261027T223928Z-extraction-a686409, mode: S-sampled}
  M: {run: 20261028T005130Z-extraction-5528fd6, mode: S}
