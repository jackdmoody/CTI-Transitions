# Pinned extraction models (spec §3). Open-weight digests are the sha256 of the GGUF model
# layer in the Ollama manifest (~/.ollama/models/manifests/registry.ollama.ai/library/<name>/<tag>);
# ollama_id is what `ollama list` shows. Qwen pulled 2026-10-24, Ministral 3 pulled 2026-10-27,
# both with Ollama 0.40.10.
# 2026-10-27 20:06 EDT (SPEC_ISSUES): S changes from qwen3:14b to Ministral 3 14B Instruct for
# provenance (no PRC-origin models), decided after the Qwen results were seen. Qwen is kept
# below as superseded.
# Sampling (spec §3, SPEC_ISSUES 2026-10-27): F accepts no temperature and its reasoning can't be
# turned off, so F = 5 samples per extraction (mean ± sd) at a pinned effort. S runs twice:
# temperature 0 (primary, `options`) and 5 samples at the model's default sampling (`sampled`,
# like-for-like with F), with thinking off in both (Ministral 3 Instruct has no thinking mode).
ollama_version: "0.40.10"
# S runs on a private single-slot server (2026-10-27): the desktop server has
# OLLAMA_NUM_PARALLEL=4, which at num_ctx 16384 needs 20 GB and spills 15% to CPU; with one
# slot qwen3:14b at 16384 is 11 GB, 100% GPU. Start it with:
#   OLLAMA_HOST=127.0.0.1:11435 OLLAMA_NUM_PARALLEL=1 OLLAMA_FLASH_ATTENTION=1 OLLAMA_MAX_LOADED_MODELS=1 ollama serve
ollama_server: {url: "http://127.0.0.1:11435", num_parallel: 1, flash_attention: 1}
frontier:
  F:
    model: claude-opus-5-5
    options: {effort: high, max_tokens: 16000}   # no sampling parameters: Opus 5.5 rejects them
    samples: 5
    usd_per_mtok: {input: 4.0, output: 20.0}
open_weight:
  S:  # primary (2026-10-27): Ministral 3 14B Instruct 2512 (Mistral AI, Apache 2.0), instruct, not reasoning
    # Built from the official ministral-3:14b-instruct-2512-q4_K_M (ollama_id 4760c35aeb9d, template
    # aa65b5ae...) with the template's default system-prompt injection removed and nothing else
    # changed (SPEC_ISSUES 2026-10-27): configs/modelfiles/, sha256 of the Modelfile below.
    tag: ministral-3-nosys:14b-instruct-2512-q4_K_M
    base_tag: ministral-3:14b-instruct-2512-q4_K_M
    modelfile: configs/modelfiles/ministral-3-nosys-14b-instruct-2512-q4_K_M.Modelfile
    modelfile_sha256: b6f12da10606a93437bd8581cb5d32c035d4fde3e632bb55e409d93540bb4168
    # as run: ae31aeb7166085d32e8f38671e7168b5c5cc35714c944c9a49358f4c892d310b (differs only in the FROM path, now ~/.ollama/...; same blob, same ollama_id; 2026-11-06)
    ollama_id: 9c53f01aa0e0
    weights_sha256: bfb40fc6bb9c3b2ed529b480e04f824c005ea8f86733d4ebbf0c204de484891e
    template_sha256: 397d02246bd1005298e81866d3c06a7dbd0ddad3677a151f363c640fbf47b38c
    parameters: 13.9B
    quantization: Q4_K_M
    context_length: 262144
    options: {temperature: 0, num_ctx: 16384}
    # Default sampling = the Modelfile params of this digest: temperature 0.15, nothing else
    # (`ollama show --parameters`). Sent explicitly, with the seed; every other sampling
    # parameter is not sent and takes Ollama's built-in default, as in the Qwen run.
    sampled: {options: {temperature: 0.15, num_ctx: 16384}, seeds: [0, 1, 2, 3, 4]}
  S_3B:  # size point: Ministral 3 3B Instruct 2512, instruct; built like S from the official
    # ministral-3:3b-instruct-2512-q4_K_M (ollama_id f04aa1c738f6, template 24c6226a...)
    tag: ministral-3-nosys:3b-instruct-2512-q4_K_M
    base_tag: ministral-3:3b-instruct-2512-q4_K_M
    modelfile: configs/modelfiles/ministral-3-nosys-3b-instruct-2512-q4_K_M.Modelfile
    modelfile_sha256: 10f4824a517a01c8b4b97381c1cb54f8d4aef259a7500cb79fdf56c1ffc0616c
    # as run: 79e8ef9c86740d55d548ee8dc8b556e6d2dca4811054cc96482c44ce0b512ad1 (differs only in the FROM path, now ~/.ollama/...; same blob, same ollama_id; 2026-11-06)
    ollama_id: 5f49d84e5598
    weights_sha256: 910e4bf4e2338f181e99796d7452404e85c1b6bbbf8cd0bb094672cf9b6f2f22
    template_sha256: 397d02246bd1005298e81866d3c06a7dbd0ddad3677a151f363c640fbf47b38c
    parameters: 3.8B
    quantization: Q4_K_M
    context_length: 262144
    options: {temperature: 0, num_ctx: 16384}
    sampled: {options: {temperature: 0.15, num_ctx: 16384}, seeds: [0, 1, 2, 3, 4]}
  S_qwen3_14b:  # superseded 2026-10-27 (was S); runs a53c21c (pre-fix) and a686409 (post-fix) kept
    tag: qwen3:14b
    ollama_id: bdbd181c33f2
    weights_sha256: a8cc1361f3145dc01f6d77c6c82c9116b9ffe3c97b34716fe20418455876c40e
    parameters: 14.8B
    quantization: Q4_K_M
    context_length: 40960
    options: {temperature: 0, num_ctx: 16384, think: false}   # 6k-token chunks (2026-10-27)
    # Default sampling = the Modelfile params of this digest (temperature 0.6, top_k 20,
    # top_p 0.95, repeat_penalty 1), so no temperature is sent; seed fixes each sample.
    sampled: {options: {num_ctx: 16384, think: false}, seeds: [0, 1, 2, 3, 4]}
  S_4B:  # superseded 2026-10-27 before any run: Qwen3-4B-Instruct-2507
    tag: qwen3:4b-instruct
    ollama_id: 0edcdef34593
    weights_sha256: 85e4a5b7b8ef0e48af0e8658f5aaab9c2324c76c1641493f4d1e25fce54b18b9
    parameters: 4.0B
    quantization: Q4_K_M
    context_length: 262144
    options: {temperature: 0, num_ctx: 8192}
