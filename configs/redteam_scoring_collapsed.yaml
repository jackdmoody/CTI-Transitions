# Case study B, collapsed (consistent) scoring: POST HOC, 2026-10-27 (SPEC_ISSUES). Repeats
# collapsed per window, only off-diagonal transitions scored; priors and P_ben with the self cell
# dropped and renormalized. U unchanged (DRIFT as published). Same test set, bootstrap, lambda = 0.
# The as-run scoring (configs/redteam_scoring.yaml) stays as reported; both go in the report.
