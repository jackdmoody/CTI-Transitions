  menuPass: {nation: China,  core: true,  attack_group: G0045}
  OilRig:   {nation: Iran,   core: true,  attack_group: G0049}
  DPRK:     {nation: DPRK,   core: true,  attack_group: G0032}   # Lazarus Group; final actor set at the DPRK decision
  Sandworm: {nation: Russia, core: false, attack_group: G0034}   # stretch
