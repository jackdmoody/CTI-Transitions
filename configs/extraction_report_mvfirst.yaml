# MULTIPLE-JSON-VALUE SENSITIVITY (first value; POST HOC, SPEC_ISSUES 2026-10-28 08:21 EDT): priors from
# <mode>__mvfirst/ (wrapping-only fix + identical values parsed + the first value of a reply whose values differ).
# As-run stays primary.
# WP6 extraction results (spec §4, §6; SPEC_ISSUES 2026-10-27): reads saved priors, no model calls.
# Refusals per chunk, strict and fragment-aware hallucination rates (R, oracle), recovery vs. plan
# ground truth (all platforms primary, Windows-only appendix), H4 prior-level matrix, H3 sensitivity.
