[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctit"
version = "0.0.1"
description = "W2: CTI-conditioned ATT&CK transition hunting"
# DRIFT is not a pip dependency: it is the git submodule at third_party/DRIFT,
# loaded by ctit/adapters/drift.py. Install its pins with
# `pip install -r third_party/DRIFT/requirements.txt`.
requires-python = ">=3.12,<3.13"
dependencies = ["python-dotenv"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["ctit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
