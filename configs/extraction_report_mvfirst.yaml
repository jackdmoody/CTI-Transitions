actors: [APT29, menuPass, OilRig, Sandworm]
conditions: [R, B, oracle]
oracle_text: data/optc_check/groundtruth/OpTCRedTeamGroundTruth.txt
prompts: {report: extract_v1.txt, memory: memory_v1.txt}
chunk: {tokens: 6000, overlap: 300}
alpha: 0.5
# Post-fix runs (true schema retry, 2026-10-27): primary. Pre-fix: configs/extraction_report_prefix.yaml.
# Models side by side (amendment 2026-10-27 21:38 EDT): F = Opus 5.5; S-Q = Qwen3-14B (pre-registered S);
# S-M = Ministral 3 14B (no-system-prompt Modelfile); S-M3 = Ministral 3 3B (size point, R and B only).
# "-sampled" = 5 seeds at each model's sampling settings (S-Q5, S-M5, S-M35 in the report).
